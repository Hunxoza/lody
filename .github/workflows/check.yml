# Checks every pull request and every push to staging: formatting, lint and tests, on Linux,
# Windows and macOS (each has code of its own: muting is Windows only, the app menu Linux
# only), and that a pull request comes the right way: feat/, fix/, docs/ or chore/ into
# staging, and only staging into main. The rulesets require all of them before a merge.
# Build runs it too before a release, so main is never released without it passing.
# From a first-time contributor's fork it waits until the maintainer approves the run.
name: Check

on:
  pull_request:
  push:
    branches: [staging]
  workflow_call:

# A new push to the same pull request cancels the check still running on the old one.
# (Named apart from the workflow: when Build runs it, both would otherwise share one group.)
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: From feat/, fix/, docs/ or chore/ into staging; only staging into main
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE:$HEAD" in
            staging:feat/* | staging:fix/* | staging:docs/* | staging:chore/* | main:staging) ;;
            *)
              echo "::error::'$HEAD' into '$BASE': open the pull request from a feat/, fix/, docs/ or chore/ branch into staging (see CONTRIBUTING.md)."
              exit 1
              ;;
          esac

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check-linux
            os: ubuntu-22.04
          - name: check-windows
            os: windows-latest
          - name: check-macos
            os: macos-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
