[package]
name = "lody-app"
description = "Lody: let your programs talk to you, in your own language"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lody-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
env_logger = "0.11.11"
log = "0.4.34"
lody-core = { version = "0.1.0", path = "../lody-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.5"
