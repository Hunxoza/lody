<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lody</title>
  <style>
    :root {
      --bg: #ffffff; --text: #111827; --muted: #6b7280; --line: #d9dee7; --accent: #2563eb;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181d; --text: #eef0f3; --muted: #9aa1ad; --line: #2e323a; --accent: #6b9cff; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      border: 1px solid var(--line); cursor: grab; user-select: none; -webkit-user-select: none;
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Noto Sans", sans-serif;
      overflow: hidden;
    }
    body:active { cursor: grabbing; }
    header { display: flex; align-items: flex-start; gap: 8px; padding: 6px 6px 2px 12px; font-size: 12px; color: var(--muted); }
    header .dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--accent); flex: none; }
    .origin { flex: 1; min-width: 0; line-height: 1.45; }
    .origin span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #from { color: var(--text); font-weight: 600; }
    #title:empty { display: none; }
    button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; }
    button:hover { background: var(--line); color: var(--text); }
    #text { flex: 1; overflow-y: auto; padding: 4px 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #text.empty { color: var(--muted); font-size: 14px; }
    #grip { position: fixed; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, var(--line) 50%, var(--line) 60%, transparent 60%, transparent 75%, var(--line) 75%, var(--line) 85%, transparent 85%); }
  </style>
</head>
<body>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <div class="origin">
      <span id="from">Lody</span>
      <span id="title"></span>
    </div>
    <button id="close" title="Hide the overlay" aria-label="Hide the overlay">×</button>
  </header>
  <div id="text" class="empty">Translations appear here as your programs reply. Drag this anywhere; it stays on top.</div>
  <div id="grip" title="Resize" aria-hidden="true"></div>
  <script src="overlay.js"></script>
</body>
</html>
